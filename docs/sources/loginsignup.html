<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTE-ME (Start) </title>
    <link rel="stylesheet" href="loginsignup.css">
    <link rel="icon"
        href="https://www.image2url.com/r2/default/images/1778755559763-5d81034e-58f8-4c0a-87fb-325e92738c76.png">

    <script src="registrationscript.js" defer></script>
    
</head>

<body>
    <div class="loginsignup-page">
        <div class="container">
            <div id="design-box">
                <h1 id="heading">Join Notes <br> Manager Today</h1>
                <p id="subheading-registration">Build your personal digital workspace <br> for smarter studying and
                    better productivity.</p>
                <img src="https://www.image2url.com/r2/default/images/1778755559763-5d81034e-58f8-4c0a-87fb-325e92738c76.png"
                    alt="Logo " id="logoondesignbox">
                <p id="subheading2-registration">* Already Joined ? <a href="#">Login</a> </p>
                <p id="subheading3-registration">* New to Join ? <button  onclick="gobackhome()">SignUp</button></p>
            </div>
            <div id="maincon-box1" class="form-container">
                <form action="../../config/signup.php" method="POST">

                    <div class="row">
                        <div class="input-group">
                            <label for="fnameinp">First Name</label>
                            <input type="text" placeholder="Enter first name" name="fnamesignup" id="fnameinp">
                        </div>

                        <div class="input-group">
                            <label for="lnameinp">Last Name</label>
                            <input type="text" placeholder="Enter last name" name="lnamesignup" id="lnameinp">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="emailinp">Email Address</label>
                        <input type="email" placeholder="Enter email address" name="emailsignup" id="emailinp">
                    </div>

                    <div class="row">
                        <div class="input-group">
                            <label for="crepasswordinp">Create Password</label>
                            <input type="password" placeholder="Create password" name="crepasssignup" id="crepasswordinp">
                        </div>

                        <div class="input-group">
                            <label for="conpasswordinp">Confirm New Password</label>
                            <input type="password" placeholder="Confirm password" name="conpasssignup" id="conpasswordinp">
                        </div>
                    </div>

                    <div class="dob-container">
                        <label class="dob-label">Date of Birth</label>

                        <div class="dob-box">
                            <select name="datesignup">
                                <option>Date</option>
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                                <option>5</option>
                            </select>

                            <select name="monthsignup">
                                <option>Month</option>
                                <option>January</option>
                                <option>February</option>
                                <option>March</option>
                                <option>April</option>
                            </select>

                            <select name="yearsignup">
                                <option>Year</option>
                                <option>2000</option>
                                <option>2001</option>
                                <option>2002</option>
                                <option>2003</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn">Register</button>

                </form>
            </div>

            <div id="maincon-box2" class="form-container2">
                <form action="" class="formtwo">
                    <div class="input-group"><label for="emailinplogin">Email</label><input type="text" value="" name="emaillogin" placeholder="Enter Email Address" id="emailinplogin">
                    </div>
                    <div class="input-group"><label for="passwordinp">Password</label><input type="password" value=""
                            name="passwordlogin" placeholder="Enter Password" id="passwordinp"></div>
                    <div>

                        <label id="forgotlabel"><a href="#">Forgot Password?</a></label>

                    </div>
                    <button id="submit-btn" type="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>
    </div>
</body>
</html>
